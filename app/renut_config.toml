# blur-nx (Blur, Bizarre Creations 2010, title 41560845, disc v0.0.0.1 with title update 2 -> v0.0.2.1) - ReXGlue
# codegen configuration. The project keeps banjo-nx's internal name "renut" (generated/renut_*.h, the renut /
# renut_recomp targets, out/renut_image.bin) so the base's CMake, post-codegen passes and renderer glue work unchanged;
# the NRO and the SD folder are blur-nx (docs/blur-notes.md, "Decisions").
#
# The generator applies assets/default.xexp (title update 2) to assets/default.xex itself.

includes = [
"config/renut_funcs.toml",
"config/renut_hooks.toml",
"overrides.toml",
]

# banjo-nx's optimised codegen keys that need no per-game audit (they change how the C++ is written, not what the
# guest sees; banjo-nx's renut_config.toml carries the reasoning and the console measurements for each):
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true

# The register diet (2026-11-10, the base's keys): r14-r31, f14-f31, v14-v31 as C++ locals (non_volatile_as_local),
# r0/r2/r11/r12/f0/v32-v63 as locals (non_argument_as_local), and no lr store where nothing reads it. Audited for Blur:
#   - non_argument_as_local: tools/non_argument_audit.py --noreturn=8295BC10 (longjmp) on code generated WITHOUT the
#     option (out/nonarg1.log): ENTRY 318 lines (nearly all MSVC exception funclets reading their parent's frame in r12),
#     RET 30, HANDOVER 0; tools/diet_keep_list.py makes the keep list below (100 ENTRY and 45 RET functions);
#   - non_volatile_as_local: tools/read_before_write.py on code generated WITH the options (docs/blur-notes.md);
#   - v64-v127 kept in the context (katamari-nx's rc3: a movie decoder loads constant vectors into v64-v72 in one
#     helper and reads them in others; Blur's Bink decoder is the same kind of code).
non_volatile_as_local = true
non_volatile_as_local_keep = ["v64-v127"]
elide_lr_stores = true
non_argument_as_local = true
non_argument_as_local_keep = [
    0x82171948, 0x82225380, 0x82227B78, 0x82233688, 0x8223C410, 0x8223C438, 0x8223C704, 0x8223C72C,
    0x8223CFC8, 0x8223CFE8, 0x8225FD20, 0x8225FD58, 0x82266650, 0x822668B8, 0x822862A0, 0x8235A140,
    0x8235A8F0, 0x8235AB60, 0x8235B258, 0x8235B400, 0x8235B840, 0x82363E50, 0x82365930, 0x82367360,
    0x82367948, 0x82369A00, 0x82369BB0, 0x8238E0C0, 0x8238E888, 0x8241EC48, 0x8241ED38, 0x8241F080,
    0x8241FA58, 0x825475D0, 0x8255BFC0, 0x8255E018, 0x825D1578, 0x825D61C0, 0x825D7C78, 0x825DA9D0,
    0x825E6798, 0x825EFC60, 0x826070C8, 0x8260BCF8, 0x8260C240, 0x8260CF20, 0x8260E788, 0x826378A8,
