# setjmp / longjmp (peggle2-nx's method, by shape; tools/ppc_dis.py on out/renut_image.bin, the patched image): setjmp
# 0x8295B940 checks a hook word (`lis r4,0x82E10000; lwz r0,-26492(r4); bnectr`) and then saves f14-f31 into the
# buffer at r3 (`stfd f14,0(r3)` at +0x1C, the image's only one); longjmp 0x8295BC10 reloads them (`mr r7,r3` ...
# `lfd f14,0(r7)` at +0x3C, the only one).
setjmp_address = 0x8295B940
longjmp_address = 0x8295BC10

project_name = "renut"
file_path = "assets/default.xex"
out_directory_path = "generated"

